name: Deploy مناقيش to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mnaqeesh-system/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel in-progress runs mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mnaqeesh-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The repo carries pnpm-lock.yaml; corepack provides pnpm.
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static export INLINES these public values into the client bundle
      # at build time, so they must be present during the build. Add them as
      # repository secrets (both are public-by-design — see HOSTING.md).
      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # For a PROJECT site (https://<user>.github.io/<repo>/) set the
          # base path to /<repo-name>. For a user site or a custom domain
          # leave it out.
          # NEXT_PUBLIC_BASE_PATH: /your-repo-name

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mnaqeesh-system/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
