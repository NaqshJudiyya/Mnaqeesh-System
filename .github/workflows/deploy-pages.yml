name: Deploy مناقيش to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mnaqeesh-system/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel in-progress runs mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mnaqeesh-system
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mnaqeesh-system/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static export INLINES these public values into the client bundle
      # at build time. The `secrets.X || 'fallback'` expressions mean the
      # deploy works even with no repository secrets configured: the
      # fallbacks are the same public-by-design values that already ship
      # inside the extension (facebook-post-saver/manaqish-config.js) —
      # data access is guarded by Supabase RLS, not by hiding these.
      # Add the two secrets to override the fallbacks.
      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://czgxygcjyvfkhsuoearu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_JBJ1FJyDVcEzu4loUl6qNQ_jMgYq1jU' }}
          # This repo IS a PROJECT site: Pages serves it under
          # https://naqshjudiyya.github.io/Mnaqeesh-System/ — the base path
          # below MUST equal the repository name exactly (case included).
          NEXT_PUBLIC_BASE_PATH: /Mnaqeesh-System

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mnaqeesh-system/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
